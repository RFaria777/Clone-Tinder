<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <title>Tinder</title>
</head>
<body>

  <header>
    <nav class="navbar">
      <i class="fa-solid fa-fire"></i>
      <i class="fa-solid fa-comment"></i>
      <i class="fa-solid fa-user"></i>
    </nav>
  </header>

  <main>
    <div class="foto-e-acoes">

      <div class="foto">
        <div class="foto-e-texto">

          <div class="foto-nome-idade">
            <h2>Ariana Grande</h2>
            <h2>32</h2>
          </div>

          <div class="bio">
            <p>
              Ícone pop, doce por natureza, voz inesquecível e coração grande.
             Presença leve, confiante e autêntica.
            </p>
          </div>

        </div>
      </div>

      <div class="acoes">
        <div class="acao x">
         <i class="fa-solid fa-xmark"></i>
        </div>

        <div class="acao star">
          <i class="fa-solid fa-star"></i>
        </div>

        <div class="acao heart">
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
